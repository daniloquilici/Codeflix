version: '3.4'

services:
  fc.codeflix.catalog.fb:
    container_name: catalogdb-e2e
    hostname: catalogdb-e2e
    image: mysql
    ports:
      - 33060:3306
    environment:
      MYSQL_ROOT_PASSWORD: rxma90ed

  keycloak:
    container_name: keycloak-e2e
    hostname: keycloak-e2e
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    ports:
      - 8080:8080
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin